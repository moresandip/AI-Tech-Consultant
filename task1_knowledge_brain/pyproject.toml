[project]
name = "task1-knowledge-brain"
version = "0.1.0"
description = "Knowledge Brain: RAG over Brilliant Directories help center"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "pillow>=10.3.0",
    "streamlit>=1.35.0",
    "tenacity>=8.3.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["."]
