[project]
name = "task3-meeting-sow"
version = "0.1.0"
description = "Meeting→SOW: multi-agent pipeline from transcript to scope, estimate, proposal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
    "tenacity>=8.3.0",
    "tiktoken>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
